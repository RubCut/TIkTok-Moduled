name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Gradle-кэш и параллелизм включены; daemon живёт в пределах одного джоба.
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          ls "$SDK" || true
          echo "platforms:"; ls "$SDK/platforms" || true
          echo "build-tools:"; ls "$SDK/build-tools" || true
          java -version

      - name: Install missing SDK packages
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -1)"
          need=0
          [ -d "$SDK/platforms/android-35" ] || need=1
          [ -d "$SDK/build-tools/35.0.0" ] || need=1
          if [ "$need" = "1" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          else
            echo "platforms;android-35 and build-tools;35.0.0 already installed"
          fi

      - name: Gradle version
        shell: bash
        run: ./gradlew --version 2>&1 | tee /tmp/ci-00-gradle.log

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace ciTest 2>&1 | tee /tmp/ci-10-test.log

      - name: Assemble debug builds
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace ciAssembleDebug 2>&1 | tee /tmp/ci-20-assemble.log

      - name: Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace ciLint 2>&1 | tee /tmp/ci-30-lint.log

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/apks
          find . -path '*/build/outputs/apk/*' -name '*.apk' -exec cp -v {} artifacts/apks/ \; || true
          find . -path '*/build/outputs/*' -name '*.zip' -exec cp -v {} artifacts/apks/ \; || true
          ls -la artifacts/apks || true

      - name: Report failure details
        if: failure()
        shell: bash
        run: python3 .github/scripts/report-failure.py /tmp/ci-00-gradle.log /tmp/ci-10-test.log /tmp/ci-20-assemble.log /tmp/ci-30-lint.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            artifacts/apks
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
