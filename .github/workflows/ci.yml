name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build:
    name: Build & test (JDK 17 · Gradle 8.11.1 · AGP 8.6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Toolchain info
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Unit tests (JVM: core, module-api, runtime, patcher)
        run: ./gradlew --stacktrace ciTest

      - name: Assemble debug builds
        run: ./gradlew --stacktrace ciAssembleDebug

      - name: Android Lint
        run: ./gradlew --stacktrace ciLint

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts/apks
          find . -path '*/build/outputs/apk/*' -name '*.apk' -exec cp -v {} artifacts/apks/ \; || true
          ls -la artifacts/apks || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            artifacts/apks
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
