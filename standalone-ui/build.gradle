// standalone-ui: общие MD3-компоненты самостоятельных приложений (ТЗ §5.1, §21.1).
// Подключается ТОЛЬКО к TModules, патчеру, тестовому хосту и веб-каталогу;
// встраиваемый runtime и module-api от него не зависят.
apply plugin: 'com.android.library'

android {
    namespace 'dev.moduled.ui'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        textReport true
    }
}

dependencies {
    api "com.google.android.material:material:$rootProject.ext.materialVersion"
    api "androidx.appcompat:appcompat:$rootProject.ext.appcompatVersion"

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
}
