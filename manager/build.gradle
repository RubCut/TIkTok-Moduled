// manager: TModules — патчер, хранилище модулей, мост, редактор конфигов,
// каталог, диагностика и управление состояниями (ТЗ §5.1, §11, §21.2).
apply plugin: 'com.android.application'

android {
    namespace 'dev.moduled.manager'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'dev.moduled.manager'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0'
        // Основной язык первой поставки — русский (§21.3).
        resourceConfigurations += ['ru', 'en']
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        debug {
            // applicationId не меняется: мост использует signature-permission и
            // общий debug-сертификат с тестовым хостом (ТЗ §20.1).
            minifyEnabled false
        }
        release {
            // Production-модель подписи решается отдельным ADR (§7.4, ADR-005):
            // релизный артефакт не подписывается debug-ключом.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        textReport true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/LICENSE*']
        }
    }

    // Сгенерированные assets: runtime DEX (PAT-05) и комплектные модули (§11.11).
    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir('generated/runtime-assets')
        }
    }
}

// --- Встраивание runtime DEX и комплектных модулей в assets менеджера -------
// Патчер берёт runtime-classes.dex из assets (§7.2 PAT-05); комплектные модули
// (sample, region, inapp-manager) поставляются готовыми ZIP и устанавливаются
// как обычные модули с отметкой «комплектный» (§11.11, §16.1).
def runtimeAssetsDir = layout.buildDirectory.dir('generated/runtime-assets')

tasks.register('bundleRuntimeDex') {
    group = 'build'
    description = 'Dexes runtime+core+module-api into assets/tmoduled/runtime-classes.dex.'
    dependsOn ':runtime:assembleRelease', ':core:jar', ':module-api:jar'
    def outDir = runtimeAssetsDir.map { it.dir('tmoduled') }
    outputs.dir(outDir)
    doLast {
        def sdkJar = rootProject.requireAndroidJar(rootProject.ext.compileSdkVersion, 'manager')
        def aar = project(':runtime').file('build/outputs/aar/runtime-release.aar')
        if (!aar.isFile()) {
            throw new GradleException("AAR runtime не найден: ${aar}")
        }
        def work = layout.buildDirectory.dir('runtime-dex-work').get().asFile
        delete work
        work.mkdirs()
        copy {
            from zipTree(aar)
            into work
            include 'classes.jar'
        }
        def coreJar = project(':core').tasks.named('jar').get().archiveFile.get().asFile
        def apiJar = project(':module-api').tasks.named('jar').get().archiveFile.get().asFile
        def od = outDir.get().asFile
        od.mkdirs()
        def d8Jar = rootProject.resolveD8Jar()
        if (d8Jar == null) {
            throw new GradleException('d8.jar не найден в build-tools SDK: задайте ANDROID_HOME')
        }
        javaexec {
            classpath = files(d8Jar)
            mainClass = 'com.android.tools.r8.D8'
            args = [
                    '--output', od.absolutePath,
                    '--lib', sdkJar.absolutePath,
                    '--classpath', sdkJar.absolutePath,
                    '--min-api', rootProject.ext.minSdkVersion.toString(),
                    new File(work, 'classes.jar').absolutePath,
                    coreJar.absolutePath,
                    apiJar.absolutePath
            ]
        }
        if (!new File(od, 'classes.dex').isFile()) {
            throw new GradleException('D8 не создал classes.dex для runtime payload')
        }
    }
}

tasks.register('bundleModuleZips', Copy) {
    group = 'build'
    description = 'Copies bundled module ZIPs into assets/tmoduled/bundled.'
    dependsOn ':sample-module:packageModule', ':region-module:packageModule',
            ':inapp-manager:packageModule'
    into runtimeAssetsDir.map { it.dir('tmoduled/bundled') }
    from project(':sample-module').layout.buildDirectory.dir('outputs/module-package')
    from project(':region-module').layout.buildDirectory.dir('outputs/module-package')
    from project(':inapp-manager').layout.buildDirectory.dir('outputs/module-package')
    // Имена стабильны: packageModule задаёт archiveVersion = null → <project>.zip.
    include '*.zip'
    includeEmptyDirs = false
}

tasks.named('preBuild') {
    dependsOn tasks.named('bundleRuntimeDex'), tasks.named('bundleModuleZips')
}

dependencies {
    // :runtime собирается как AAR-вход для D8 (задача bundleRuntimeDex).
    implementation project(':core')
    implementation project(':standalone-ui')
    implementation project(':patcher')

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.6'

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
}
